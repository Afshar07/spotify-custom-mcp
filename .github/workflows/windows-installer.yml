name: Windows installer

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - name: Build standalone executable (Node SEA)
        run: npm run build:exe
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\SpotifyCurator.iss
          Get-FileHash dist-installer\*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist-installer\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SpotifyCurator-installer
          path: |
            dist-installer/*.exe
            dist-installer/SHA256SUMS.txt
          if-no-files-found: error
      - name: Attach installer and checksums to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $assets = (Get-ChildItem dist-installer\*.exe).FullName
          gh release upload "$env:RELEASE_TAG" @assets dist-installer\SHA256SUMS.txt --repo "$env:GITHUB_REPOSITORY" --clobber
